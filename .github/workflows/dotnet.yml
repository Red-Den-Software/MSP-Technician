name: .NET Release

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish Portable App
      run: >
        dotnet publish msptool/msptool.csproj
        -c Release
        -r win-x64
        --self-contained true
        /p:PublishSingleFile=true
        -o publish

    - name: Get version
      id: version
      shell: pwsh
      run: |
        $version = "1.0.${{ github.run_number }}"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Zip Release
      run: |
        Compress-Archive -Path publish\* -DestinationPath msptool-${{ steps.version.outputs.VERSION }}-win-x64.zip

    - name: Create Git Tag
      run: |
        git tag v${{ steps.version.outputs.VERSION }}
        git push origin v${{ steps.version.outputs.VERSION }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: MyApp v${{ steps.version.outputs.VERSION }}
        files: MyApp-${{ steps.version.outputs.VERSION }}-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
