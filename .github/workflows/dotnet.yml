name: Velopack Build & Release

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish app
      run: >
        dotnet publish msptool.csproj
        -c Release
        -r win-x64
        --self-contained true
        -o publish

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Add tools to PATH
      shell: pwsh
      run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -FilePath $env:GITHUB_PATH


    - name: Pack with Velopack
      run: >
        vpk pack
        -u msptool
        -v 1.0.${{ github.run_number }}
        -p publish
        -o dist
        --channel win

    - name: Upload Release to GitHub
      shell: pwsh
      run: >
        vpk upload github --repoUrl https://github.com/Red-Den-Software/MSP-Technician
        --channel win
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
