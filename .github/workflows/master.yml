name: Build Portable Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Publish Portable App
      run: >
        dotnet publish msptool/msptool.csproj
        -c Release
        -r win-x64
        --self-contained true
        /p:PublishSingleFile=true
        /p:PublishTrimmed=false
        -o publish

    - name: Zip Portable Build
      run: |
        Compress-Archive `
          -Path publish\* `
          -DestinationPath msptool-win-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          msptool-win-x64.zip
